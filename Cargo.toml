[package]
name = "saola-files"
version = "0.1.0"
edition = "2024"
description = "The file manager for the Saola desktop environment"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JorDunn/saola-files"

[features]
# Protocol backends are feature-gated modules in `src/modules/` — users
# building from source pick their set (`--no-default-features` for a
# local-only binary). The release/AUR build ships the defaults. Each
# feature's optional dependencies land in the same PR as its module.
#
# "sftp" was reserved from day one so the CI feature matrix
# (`--all-features` / `--no-default-features`) exercised both build shapes
# before the module existed. Stage 14 gives it real `dep:` entries — see
# the dated survey comment on `russh`/`russh-sftp` below for the protocol
# library choice.
default = ["sftp"]
sftp = ["dep:russh", "dep:russh-sftp"]

[dependencies]
# GUI toolkit. Surveyed 2026-08-08: iced is the only toolkit the Saola
# ecosystem targets (saola-theme is an iced style crate; panel, capture and
# lockscreen are all iced 0.14), so there was no real alternative to weigh —
# GTK/Qt would orphan the design system. Unlike the panel/capture this app is
# an ordinary toplevel window, not a layer-shell surface, so there is no
# iced_layershell here and never should be. Features, following capture's
# posture of default renderer features plus what the app needs:
# `tokio` (one shared async runtime — zbus joins it in a later stage),
# `svg` (Lucide icons, Stage 6), `image` (thumbnails, Stage 11).
iced = { version = "0.14", features = ["tokio", "svg", "image"] }

# The Saola design system: tokens (colors, typography, radii, sizes) and
# iced style helpers. `tag` and `version` must move together — cargo errors
# if they disagree, which is the guard against drifting off a released tag.
# Never point this at `branch = "main"`; bumping the tag is a deliberate,
# reviewed change (see CLAUDE.md "Design language").
# Pinned 2026-08-08 at the same tag the panel and capture use.
saola-theme = { git = "https://github.com/JorDunn/saola-theme", tag = "saola-theme-v0.8.0", version = "0.8.0" }

# Config parsing. Surveyed 2026-08-08: the family standard is hand-walked
# parsing over a real parser's loose document type. capture (the newest
# precedent, migrated from KDL 2026-08-08) uses `toml`'s `Table` for this;
# `toml_edit` adds format-preserving round-tripping we don't need (we never
# write the config), and serde-derive on the config struct is banned by the
# resilience rules (one bad knob must degrade alone, with its own warning).
# serde comes along transitively as toml's data model; we don't derive on it.
toml = "0.9"

# Dependency debt is cheap to take on and expensive to shed; every addition
# below this line needs a dated survey comment like the ones above
# (alternatives considered, why they lost) — the panel's Cargo.toml is the
# reference for the format.

# `Backend::caps()` (src/core/vfs.rs, Stage 3). Surveyed 2026-08-08: the
# alternative is a hand-rolled `struct Caps { watch: bool, trash: bool, ... }`
# with six `bool` fields — bitflags gives `contains`/`|`/`Debug` for free and
# is the ecosystem-standard shape for "what can this backend do" capability
# sets (this exact use case). Already present transitively (pulled in by
# other deps at 1.3 and 2.x), so this just makes it a direct, versioned
# dependency instead of an implicit one. `iced_core::keyboard::Modifiers`
# (already in the dependency graph) is itself built on bitflags 2.x, so
# there's no version-fragmentation cost.
bitflags = "2"

# `core::vfs::Backend` (Stage 3) is `dyn`-safe with `async fn` methods via
# `async_trait`'s boxing macro. Surveyed 2026-08-08: the alternative is
# hand-writing `fn list(&self, ..) -> Pin<Box<dyn Future<Output = ..> + Send
# + '_>>` at each of the trait's nine async methods — mechanical
# boilerplate that obscures the actual signatures teaching-notes-style
# comments are supposed to explain. `async_trait` is the de facto standard
# for this (rust-lang/rfcs #3185's motivating use case) and is already
# transitively present via other deps, so this pins it as a direct one.
async-trait = "0.1"

# `modules::local`'s `spawn_blocking` calls (Stage 3 — CLAUDE.md: "One
# async runtime: iced's tokio executor and zbus's tokio integration share
# it; never construct a second"). Already pulled in transitively by iced's
# `tokio` feature (see the `iced` entry above), which *is* the shared
# runtime this crate's blocking-file-I/O calls run on — this makes that an
# explicit, versioned dependency instead of relying on it staying available
# transitively. No `rt-multi-thread`/other extra features requested here:
# iced's own feature selection already provides the runtime this crate's
# code calls into.
# `features = ["sync"]` added Stage 11: `core::thumbs::thumbnail_for` bounds
# concurrent thumbnail generation with a `tokio::sync::Semaphore`
# (CLAUDE.md: "never unbounded task spawns") — `Semaphore` lives behind
# tokio's `sync` feature specifically, which nothing already enables
# transitively (iced's own `tokio` feature only pulls in `iced_futures`'
# executor integration, not `tokio::sync`), so this is requested explicitly
# rather than relied on.
tokio = { version = "1", features = ["sync"] }

# `core::vfs::{ReadStream, WriteSink}` and the local backend's chunked
# read/write (Stage 3) need `Stream`/`Sink`/`BoxStream` and a channel that
# isn't `tokio::sync` (CLAUDE.md: iced messages use `iced::futures::channel::
# mpsc`, and this crate's `core/` layer must stay iced-free — see its module
# docs — so it uses the `futures` crate directly rather than reaching through
# `iced::futures`). Already an indirect dependency of `iced`/`tokio`; this
# pins the version this crate's code actually names in `use` paths.
futures = "0.3"

# `LocalBackend::watch()` (Stage 5, src/modules/local.rs) — the inotify
# backend CLAUDE.md's "signal, never poll" rule calls for on Linux local
# watching. Surveyed 2026-08-09: `notify` (cross-platform, wraps inotify/
# FSEvents/ReadDirectoryChangesW behind one trait) was the obvious
# alternative, and ships its own debouncer (`notify-debouncer-mini`) that
# would have done this stage's MOVED_FROM/TO cookie-pairing for us — but
# Saola only ever runs on Linux (niri is Wayland-only, see this crate's
# top-level docs), so the cross-platform abstraction buys nothing, and its
# `Event` type doesn't expose the raw rename `cookie` this stage's pairing
# logic reads directly. `inotify` (hannobraun's crate) is the thin,
# idiomatic wrapper CLAUDE.md's own wording ("inotify for local watching")
# points at: `Event::cookie` and `EventMask::Q_OVERFLOW` are both
# first-class, and its default `stream` feature bridges to the *existing*
# shared tokio runtime's `AsyncFd`/timer drivers (iced_futures already
# turns on tokio's `rt`/`rt-multi-thread`/`time`; `stream` only adds `net`
# for `AsyncFd` — no second runtime, per CLAUDE.md's "one async runtime").
inotify = "0.11"

# `core::mime::MimeDb` (Stage 6, src/core/mime.rs) — mimetype resolution for
# icon selection and default-app lookup. Surveyed 2026-08-09 per PLAN.md's
# stated choice ("use the `xdg-mime` crate if its license passes the
# survey-essay check, else hand-parse `/usr/share/mime/globs2` plus a 4 KiB
# sniff"): `xdg-mime` (ebassi/xdg-mime-rs) is Apache-2.0, which is fully
# compatible with this crate's `MIT OR Apache-2.0` — the license passes
# outright, so hand-rolling glob2 weighting, magic-byte offset/mask
# matching, and the alias/subclass tables (~2000 lines in the real crate)
# would just be reinventing what a compatibly-licensed, actively-maintained
# crate (last pushed 2025-08-11) already gets right. It walks
# `$XDG_DATA_HOME/mime`/`$XDG_DATA_DIRS/mime` itself at construction time —
# the one place `core::mime` touches the filesystem, and it's a system
# database load (same category as `config.rs` reading `files.toml`), not
# "file access" in the VFS sense CLAUDE.md's "all file access goes through a
# `Backend`" rule is about. No feature flags to trim (the crate has none);
# its transitive deps (`glob`, `mime`, `nom`, `dirs-next`, `unicase`) are
# small, single-purpose parsing/path crates, not a heavy pull.
xdg-mime = "0.4"

# `core::udisks` (Stage 7) — UDisks2 mount discovery for the places
# sidebar, the app's first D-Bus consumer. Surveyed 2026-08-09: `zbus` is
# the crate every sibling Saola surface already standardizes on (panel,
# capture, session), so there was no real alternative to weigh — a second
# D-Bus binding would mean two async D-Bus stacks sharing one process for
# no benefit. `default-features = false` drops zbus's default `async-io`
# executor; `tokio` re-enables just the integration that lets it run its
# socket-reader tasks on the *same* shared runtime iced's own `tokio`
# feature provides (CLAUDE.md: "one async runtime … never construct a
# second") — the exact posture the panel's Cargo.toml documents for this
# same dependency.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# `core::clipboard_interop` (Stage 10) — writing `text/uri-list` +
# `x-special/gnome-copied-files` on copy/cut, and a best-effort read on
# paste, so a plain Ctrl+C in this app pastes into Nautilus/Dolphin/etc.
# and vice versa. Surveyed 2026-08-09: `arboard` (the usual cross-platform
# clipboard crate) has no concept of file-list MIME types at all — it's
# text/image only, and this app needs to offer/parse two specific,
# file-manager-shaped MIME payloads, not generic clipboard text. Hand-rolling
# the Wayland `wlr-data-control`/`ext-data-control` protocol bindings
# directly (`wayland-client` + `wayland-protocols-wlr`) is what
# `wl-clipboard-rs` already *is* — it's the crate the `wl-copy`/`wl-paste`
# CLI tools themselves are built on (same author), it exposes exactly the
# multi-MIME-source `copy_multi`/MIME-filtered `get_contents` shape this
# module needs, and it's already resident in this machine's cargo registry
# cache at 0.9.3 (no new download). **Unconditional, not feature-gated**:
# `--no-default-features` only elides *remote protocol* backends (the
# `sftp` feature) — desktop clipboard interop is exactly as fundamental a
# local-desktop concern as inotify watching (`inotify`, above) or mount
# discovery (`zbus`, above), both already unconditional dependencies, so
# gating this one differently would be an arbitrary inconsistency. It talks
# to the compositor over `$WAYLAND_DISPLAY` at *runtime* only — building
# this crate (including in a headless CI sandbox with no compositor at all)
# never touches Wayland, and every call site wraps it in `spawn_blocking`
# with the failure path (`ConnectError::NoCompositor` when unset/absent)
# turned into an ordinary `Result`, never a panic — see
# `core::clipboard_interop`'s own module doc comment.
wl-clipboard-rs = "0.9"

# `core::thumbs` (Stage 11) — decoding a source image and resizing it down
# to a thumbnail. Surveyed 2026-08-09: already resident transitively at
# 0.25.10 (`iced`'s own `image` feature — see the `iced` entry above —
# pulls it in for `iced::widget::image` to decode/display bytes with), so
# this is just making that an explicit, versioned direct dependency rather
# than relying on it staying available transitively; no new download, no
# new version in the dependency graph. Default features (`default-formats`)
# match what iced's own resolution already built, covering every common
# raster format (jpeg/png/gif/webp/bmp/ico/tiff/…) a thumbnailer needs.
image = "0.25"

# `core::thumbs` (Stage 11) — writing the freedesktop thumbnail spec's
# required `tEXt` metadata chunks (`Thumb::URI`/`Thumb::MTime`) and reading
# them back to validate a cached entry. Surveyed 2026-08-09: `image`'s own
# PNG encoder (`image::codecs::png`) has no API for writing arbitrary
# `tEXt` chunks at all — it only encodes pixel data — so satisfying the
# spec's metadata requirement needs the lower-level `png` crate directly,
# which `Encoder::add_text_chunk`/`Decoder`'s `Info::uncompressed_latin1_
# text` expose exactly what's needed. Already resident transitively at
# 0.18.1 (`image`'s own `png` feature, part of its `default-formats`), so
# — same as the `image` entry above — this is an explicit direct dependency
# for a crate already in the resolved graph, not a new download.
png = "0.18"

# `modules::sftp` (Stage 14, `feature = "sftp"`) — the file manager's one
# remote protocol backend. Surveyed 2026-08-10, three real candidates:
#
# 1. **`russh` (chosen)** — a pure-Rust SSH client/server implementation
#    (Apache-2.0), paired with `russh-sftp` for the SFTP subsystem layered
#    on top of it. "Pure-Rust SSH" has a real maturity question attached —
#    it is not the wire-compatible-with-every-openssh-quirk depth that 20+
#    years of C OpenSSH has, and its crate history is genuinely tangled:
#    `russh` began as a fork of the abandoned `thrussh` (Pierre-Étienne
#    Meunier's crate, itself the base a few other forks — `Eugeny/russh`,
#    now `warp-tech/russh`, is the actively maintained lineage this pins
#    to), and it depends on an *internal fork* of the `ssh-key` crate
#    (`internal-russh-forked-ssh-key`, pulled in transitively — not named
#    directly in this file) rather than upstream `RustCrypto/ssh-key`,
#    which is a yellow flag for how cleanly it tracks upstream security
#    fixes. Weighed against that: it's actively maintained (warp-tech, the
#    Warp terminal company, ships it in production for their own SSH
#    client), has no `unsafe` FFI surface at all (unlike option 2 below),
#    integrates directly with the *existing* shared tokio runtime
#    (CLAUDE.md's "one async runtime" rule — no subprocess, no second
#    event loop), and — decisively — ships `russh::keys::known_hosts`
#    (`check_known_hosts_path`/`learn_known_hosts_path`) implementing the
#    exact OpenSSH `~/.ssh/known_hosts` format (including hashed
#    `|1|salt|hash` host entries) out of the box, which is precisely the
#    first-contact host-key verification this stage's done criteria need
#    and neither of the alternatives below hands over for free.
#
# 2. **`openssh-sftp-client` + a spawned system `ssh`** — shells out to the
#    user's real, already-configured OpenSSH client (`ssh -s sftp`, or
#    `ssh -oBatchMode -oControlMaster` for connection reuse) and speaks
#    SFTP over its stdio. This is the PLAN.md-documented fallback and the
#    *safer* choice in one specific sense: it inherits OpenSSH's own
#    `~/.ssh/config` (Host aliases, ProxyJump, IdentityFile selection —
#    all the configuration Jordan may already have tuned) and its
#    already-battle-tested known_hosts/host-key UX for free, since it's
#    the same `ssh` binary a terminal `ssh` invocation would use. It loses
#    on two fronts that matter more for *this* stage specifically: (a)
#    first-contact host-key trust becomes an *interactive TTY prompt on
#    the spawned child's stderr* (OpenSSH's `StrictHostKeyChecking=ask`
#    talks to a controlling terminal, not a pipe) — making it prompt
#    through *our* GUI dialog instead of a native terminal means either
#    setting `StrictHostKeyChecking=no` (silently trusts every host key,
#    unacceptable) or re-implementing the known_hosts dance ourselves
#    anyway via `ssh-keyscan`/manual file parsing, which is most of
#    option 1's own host-key code with none of its channel plumbing; and
#    (b) password auth has the same problem — batch-mode `ssh` refuses to
#    prompt on a non-TTY, so password auth would need `sshpass`-style
#    stdin injection (fragile, and `sshpass` itself warns its own approach
#    is insecure) or an askpass helper script, both meaningfully more
#    moving parts than `russh::client::Handle::authenticate_password`
#    being an ordinary async method call. **This remains the documented
#    fallback design** (`modules/sftp.rs`'s own module doc comment notes
#    where to cut over) if `russh`'s maturity becomes a real operational
#    problem later — the module boundary (CLAUDE.md: "the app doesn't
#    care") means switching backends never touches `core::vfs::Backend`'s
#    trait shape, `core::remote::RemoteManager`, or `ui::dialogs::connect`.
#
# 3. **`thrussh` directly** — the abandoned ancestor `russh` itself forked
#    from; last published years ago, no realistic path to fixes for
#    anything found since. Ruled out immediately; not a real candidate,
#    just the historical reason `russh`'s own git history looks the way
#    it does.
#
# `default-features = false` on `russh`, keeping only `flate2` (its own
# default) back on explicitly — SFTP over a real network genuinely
# benefits from transport compression the way local disk I/O never does;
# the other opt-in features (`legacy-ed25519-pkcs8-parser`, `dsa`,
# `async-trait`) are all either dead cryptography or a Rust-version compat
# shim this crate's MSRV doesn't need (native `async fn` in traits, per
# CLAUDE.md's "iced 0.14 gotchas" section's own posture on avoiding
# `async_trait` where it isn't required — `core::vfs::Backend` needs it for
# `dyn`-safety, `russh::client::Handler`/`russh_sftp::client::Handler` do
# not, since neither is ever boxed as a trait object here).
russh = { version = "0.52", optional = true, default-features = false, features = [
    "flate2",
] }

# The SFTP (SSH File Transfer Protocol) subsystem client, layered on top of
# an already-authenticated `russh` session (`Channel::request_subsystem(
# true, "sftp")`, then `SftpSession::new` over that channel's byte stream —
# see `modules::sftp`'s module doc comment for the full handshake). Same
# survey/date as `russh` above; the two are a matched pair from the same
# maintainer (`warp-tech`), not independently chosen. **Disclosed gap**:
# every path-taking method on `russh_sftp::client::SftpSession` takes
# `impl Into<String>`, not raw bytes — unlike `modules::local` (which
# preserves non-UTF8 filenames losslessly via `OsStrExt`/`symlink_metadata`,
# see that module's own tests), a remote filename that isn't valid UTF-8
# cannot round-trip through this crate's API at all. CLAUDE.md's OsString
# discipline is honored everywhere *this app's own code* touches a path
# (`core::vfs::Location::path` stays `PathBuf` end-to-end, converted to the
# wire string at exactly one point — `modules::sftp::wire_path`, sibling to
# `Location::Display`'s own single `to_string_lossy` call site); the gap is
# strictly inside the third-party crate's wire encoding, disclosed here and
# in that module's doc comment rather than silently accepted.
russh-sftp = { version = "2.4", optional = true, default-features = true }

[dev-dependencies]
# `modules::local`'s unit tests call `LocalBackend` methods directly (not
# through `iced::Task`), so they need *some* live Tokio runtime for
# `tokio::task::spawn_blocking` to run on — outside `iced::application`,
# nothing provides one. Surveyed 2026-08-08: this stays a `dev-dependencies`
# entry (test-only), not an addition to `[dependencies]`'s plain `tokio =
# "1"` above, because the running app never constructs its own runtime
# (CLAUDE.md: "One async runtime … never construct a second" — it uses
# iced's); only tests, which run outside iced's executor, need to spin up
# a throwaway one via `#[tokio::test]`. `rt` for `spawn_blocking`/the
# runtime itself, `macros` for the `#[tokio::test]` attribute, `time` for
# the async poll-sleep the write-streaming test uses to wait on a detached
# blocking writer thread — the smallest feature set that makes the
# local-backend tests runnable.
tokio = { version = "1", features = ["rt", "macros", "time"] }

[profile.dev.package."*"]
# Dependencies at full optimization even in dev builds (capture precedent):
# iced's software/GPU rendering stack is unusably slow at opt-level 0, and
# dependencies rarely change, so the cost is one long first build.
opt-level = 3
