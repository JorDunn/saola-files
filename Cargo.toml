[package]
name = "saola-files"
version = "0.1.0"
edition = "2024"
description = "The file manager for the Saola desktop environment"
license = "MIT OR Apache-2.0"
repository = "https://github.com/JorDunn/saola-files"

[features]
# Protocol backends are feature-gated modules in `src/modules/` — users
# building from source pick their set (`--no-default-features` for a
# local-only binary). The release/AUR build ships the defaults. Each
# feature's optional dependencies land in the same PR as its module.
#
# "sftp" is reserved here from day one so the CI feature matrix
# (`--all-features` / `--no-default-features`) exercises both build shapes
# before the module exists; its `dep:` entries arrive with `modules/sftp.rs`.
default = ["sftp"]
sftp = []

[dependencies]
# GUI toolkit. Surveyed 2026-08-08: iced is the only toolkit the Saola
# ecosystem targets (saola-theme is an iced style crate; panel, capture and
# lockscreen are all iced 0.14), so there was no real alternative to weigh —
# GTK/Qt would orphan the design system. Unlike the panel/capture this app is
# an ordinary toplevel window, not a layer-shell surface, so there is no
# iced_layershell here and never should be. Features, following capture's
# posture of default renderer features plus what the app needs:
# `tokio` (one shared async runtime — zbus joins it in a later stage),
# `svg` (Lucide icons, Stage 6), `image` (thumbnails, Stage 11).
iced = { version = "0.14", features = ["tokio", "svg", "image"] }

# The Saola design system: tokens (colors, typography, radii, sizes) and
# iced style helpers. `tag` and `version` must move together — cargo errors
# if they disagree, which is the guard against drifting off a released tag.
# Never point this at `branch = "main"`; bumping the tag is a deliberate,
# reviewed change (see CLAUDE.md "Design language").
# Pinned 2026-08-08 at the same tag the panel and capture use.
saola-theme = { git = "https://github.com/JorDunn/saola-theme", tag = "saola-theme-v0.5.0", version = "0.5.0" }

# Config parsing. Surveyed 2026-08-08: the family standard is hand-walked
# parsing over a real parser's loose document type. capture (the newest
# precedent, migrated from KDL 2026-08-08) uses `toml`'s `Table` for this;
# `toml_edit` adds format-preserving round-tripping we don't need (we never
# write the config), and serde-derive on the config struct is banned by the
# resilience rules (one bad knob must degrade alone, with its own warning).
# serde comes along transitively as toml's data model; we don't derive on it.
toml = "0.9"

# Dependency debt is cheap to take on and expensive to shed; every addition
# below this line needs a dated survey comment like the ones above
# (alternatives considered, why they lost) — the panel's Cargo.toml is the
# reference for the format.

# `Backend::caps()` (src/core/vfs.rs, Stage 3). Surveyed 2026-08-08: the
# alternative is a hand-rolled `struct Caps { watch: bool, trash: bool, ... }`
# with six `bool` fields — bitflags gives `contains`/`|`/`Debug` for free and
# is the ecosystem-standard shape for "what can this backend do" capability
# sets (this exact use case). Already present transitively (pulled in by
# other deps at 1.3 and 2.x), so this just makes it a direct, versioned
# dependency instead of an implicit one. `iced_core::keyboard::Modifiers`
# (already in the dependency graph) is itself built on bitflags 2.x, so
# there's no version-fragmentation cost.
bitflags = "2"

# `core::vfs::Backend` (Stage 3) is `dyn`-safe with `async fn` methods via
# `async_trait`'s boxing macro. Surveyed 2026-08-08: the alternative is
# hand-writing `fn list(&self, ..) -> Pin<Box<dyn Future<Output = ..> + Send
# + '_>>` at each of the trait's nine async methods — mechanical
# boilerplate that obscures the actual signatures teaching-notes-style
# comments are supposed to explain. `async_trait` is the de facto standard
# for this (rust-lang/rfcs #3185's motivating use case) and is already
# transitively present via other deps, so this pins it as a direct one.
async-trait = "0.1"

# `modules::local`'s `spawn_blocking` calls (Stage 3 — CLAUDE.md: "One
# async runtime: iced's tokio executor and zbus's tokio integration share
# it; never construct a second"). Already pulled in transitively by iced's
# `tokio` feature (see the `iced` entry above), which *is* the shared
# runtime this crate's blocking-file-I/O calls run on — this makes that an
# explicit, versioned dependency instead of relying on it staying available
# transitively. No `rt-multi-thread`/other extra features requested here:
# iced's own feature selection already provides the runtime this crate's
# code calls into.
tokio = "1"

# `core::vfs::{ReadStream, WriteSink}` and the local backend's chunked
# read/write (Stage 3) need `Stream`/`Sink`/`BoxStream` and a channel that
# isn't `tokio::sync` (CLAUDE.md: iced messages use `iced::futures::channel::
# mpsc`, and this crate's `core/` layer must stay iced-free — see its module
# docs — so it uses the `futures` crate directly rather than reaching through
# `iced::futures`). Already an indirect dependency of `iced`/`tokio`; this
# pins the version this crate's code actually names in `use` paths.
futures = "0.3"

# `LocalBackend::watch()` (Stage 5, src/modules/local.rs) — the inotify
# backend CLAUDE.md's "signal, never poll" rule calls for on Linux local
# watching. Surveyed 2026-08-09: `notify` (cross-platform, wraps inotify/
# FSEvents/ReadDirectoryChangesW behind one trait) was the obvious
# alternative, and ships its own debouncer (`notify-debouncer-mini`) that
# would have done this stage's MOVED_FROM/TO cookie-pairing for us — but
# Saola only ever runs on Linux (niri is Wayland-only, see this crate's
# top-level docs), so the cross-platform abstraction buys nothing, and its
# `Event` type doesn't expose the raw rename `cookie` this stage's pairing
# logic reads directly. `inotify` (hannobraun's crate) is the thin,
# idiomatic wrapper CLAUDE.md's own wording ("inotify for local watching")
# points at: `Event::cookie` and `EventMask::Q_OVERFLOW` are both
# first-class, and its default `stream` feature bridges to the *existing*
# shared tokio runtime's `AsyncFd`/timer drivers (iced_futures already
# turns on tokio's `rt`/`rt-multi-thread`/`time`; `stream` only adds `net`
# for `AsyncFd` — no second runtime, per CLAUDE.md's "one async runtime").
inotify = "0.11"

# `core::mime::MimeDb` (Stage 6, src/core/mime.rs) — mimetype resolution for
# icon selection and default-app lookup. Surveyed 2026-08-09 per PLAN.md's
# stated choice ("use the `xdg-mime` crate if its license passes the
# survey-essay check, else hand-parse `/usr/share/mime/globs2` plus a 4 KiB
# sniff"): `xdg-mime` (ebassi/xdg-mime-rs) is Apache-2.0, which is fully
# compatible with this crate's `MIT OR Apache-2.0` — the license passes
# outright, so hand-rolling glob2 weighting, magic-byte offset/mask
# matching, and the alias/subclass tables (~2000 lines in the real crate)
# would just be reinventing what a compatibly-licensed, actively-maintained
# crate (last pushed 2025-08-11) already gets right. It walks
# `$XDG_DATA_HOME/mime`/`$XDG_DATA_DIRS/mime` itself at construction time —
# the one place `core::mime` touches the filesystem, and it's a system
# database load (same category as `config.rs` reading `files.toml`), not
# "file access" in the VFS sense CLAUDE.md's "all file access goes through a
# `Backend`" rule is about. No feature flags to trim (the crate has none);
# its transitive deps (`glob`, `mime`, `nom`, `dirs-next`, `unicase`) are
# small, single-purpose parsing/path crates, not a heavy pull.
xdg-mime = "0.4"

# `core::udisks` (Stage 7) — UDisks2 mount discovery for the places
# sidebar, the app's first D-Bus consumer. Surveyed 2026-08-09: `zbus` is
# the crate every sibling Saola surface already standardizes on (panel,
# capture, session), so there was no real alternative to weigh — a second
# D-Bus binding would mean two async D-Bus stacks sharing one process for
# no benefit. `default-features = false` drops zbus's default `async-io`
# executor; `tokio` re-enables just the integration that lets it run its
# socket-reader tasks on the *same* shared runtime iced's own `tokio`
# feature provides (CLAUDE.md: "one async runtime … never construct a
# second") — the exact posture the panel's Cargo.toml documents for this
# same dependency.
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
# `modules::local`'s unit tests call `LocalBackend` methods directly (not
# through `iced::Task`), so they need *some* live Tokio runtime for
# `tokio::task::spawn_blocking` to run on — outside `iced::application`,
# nothing provides one. Surveyed 2026-08-08: this stays a `dev-dependencies`
# entry (test-only), not an addition to `[dependencies]`'s plain `tokio =
# "1"` above, because the running app never constructs its own runtime
# (CLAUDE.md: "One async runtime … never construct a second" — it uses
# iced's); only tests, which run outside iced's executor, need to spin up
# a throwaway one via `#[tokio::test]`. `rt` for `spawn_blocking`/the
# runtime itself, `macros` for the `#[tokio::test]` attribute, `time` for
# the async poll-sleep the write-streaming test uses to wait on a detached
# blocking writer thread — the smallest feature set that makes the
# local-backend tests runnable.
tokio = { version = "1", features = ["rt", "macros", "time"] }

[profile.dev.package."*"]
# Dependencies at full optimization even in dev builds (capture precedent):
# iced's software/GPU rendering stack is unusably slow at opt-level 0, and
# dependencies rarely change, so the cost is one long first build.
opt-level = 3
