name: Task
description: One unit of work — one issue, one branch, one PR.
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What this task delivers and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions that make this task done.
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Tests to add or run, and the live GUI check items.
    validations:
      required: true
  - type: textarea
    id: areas
    attributes:
      label: Files and areas likely touched
      description: Lets the dispatcher keep conflicting tasks apart.
  - type: textarea
    id: blocked-by
    attributes:
      label: Blocked by
      description: >-
        Prefer native "blocked by" links. Where a link cannot be made, add
        one line per blocker in exactly this form.
      placeholder: "Blocked by: JorDunn/saola-theme#N"
  - type: textarea
    id: notes
    attributes:
      label: Notes
